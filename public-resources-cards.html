<script>
(function () {
  var container = document.getElementById('public-resources');
  if (!container) return;

  var status = document.getElementById('resources-status');

  container.querySelectorAll('.res-btn').forEach(function (button) {
    button.addEventListener('click', function () {
      var url = (this.getAttribute('data-download-url') || '').trim();

      // Live file: hand off to the browser's download handling.
      if (url) {
        window.location.href = url;
        return;
      }

      // No URL wired up yet — say so rather than failing silently.
      var self = this;
      var label = self.getAttribute('data-label') || self.innerText;
      self.setAttribute('data-label', label);
      self.innerText = 'Link coming soon';
      self.style.background = '#64748b';
      if (status) status.textContent = label + ' is not available yet.';

      setTimeout(function () {
        self.innerText = label;
        self.style.background = '#0d9be2';
      }, 2000);
    });
  });
})();
</script>
