  Public resources — download cards (Modern UI)

  An empty data-download-url makes that button report "Link coming soon" instead of failing silently.

      <button type="button" class="res-btn" data-download-url="https://therapynearme.com.au/wp-content/uploads/2026/08/GMHCAAB_2027_Citation_Crosswalk.csv" data-filename="GMHCAAB_2027_Citation_Crosswalk.csv" style="width: 100%; background: #0d9be2; color: #ffffff; border: none; padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; line-height: 1.4; cursor: pointer; text-align: center;">Download citation crosswalk (CSV)</button>

<script>
(function () {
  var container = document.getElementById('public-resources');
  if (!container) return;

  var status = document.getElementById('resources-status');

  /* Citation files, served from the page itself so they need no hosting.
     Keep in sync with GMHCAAB_2027_Citation.bib / .ris. */
  var INLINE_FILES = {
    bibtex: {
      type: 'application/x-bibtex;charset=utf-8',
      text: [
        '@techreport{therapynearme2027gmhcaab,',
        '  author      = {{Therapy Near Me Pty Ltd}},',
        '  title       = {Global Mental Health Care Access and Affordability Benchmark 2027 (GMHCAAB 2027)},',
        '  institution = {AIHEM},',
        '  publisher   = {AIHEM},',
        '  year        = {2027},',
        '  type        = {Research report},',
        '  edition     = {Public Release Edition, Version 1.1},',
        '  isbn        = {978-0-9806811-1-6},',
        '  url         = {https://therapynearme.com.au/global-mental-health-care-access-and-affordability-benchmark-2027/}',
        '}',
        ''
      ].join('\n')
    },
    ris: {
      type: 'application/x-research-info-systems;charset=utf-8',
      text: [
        'TY  - RPRT',
        'AU  - Therapy Near Me Pty Ltd',
        'TI  - Global Mental Health Care Access and Affordability Benchmark 2027 (GMHCAAB 2027)',
        'PY  - 2027',
        'PB  - AIHEM',
        'ET  - Public Release Edition, Version 1.1',
        'SN  - 978-0-9806811-1-6',
        'UR  - https://therapynearme.com.au/global-mental-health-care-access-and-affordability-benchmark-2027/',
        'ER  - ',
        ''
      ].join('\n')
    }
  };

  function triggerDownload(href, filename, revoke) {
    var a = document.createElement('a');
    a.href = href;
    if (filename) a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    if (revoke) setTimeout(function () { URL.revokeObjectURL(href); }, 1000);
  }

  function flash(button, message, colour) {
    var label = button.getAttribute('data-label') || button.innerText;
    button.setAttribute('data-label', label);
    button.innerText = message;
    button.style.background = colour;
    if (status) status.textContent = label + ': ' + message;
    setTimeout(function () {
      button.innerText = label;
      button.style.background = '#0d9be2';
    }, 2000);
  }

  container.querySelectorAll('.res-btn').forEach(function (button) {
    button.addEventListener('click', function () {
      var filename = this.getAttribute('data-filename') || '';
      var inline = this.getAttribute('data-inline-file');

      // BibTeX / RIS: build the file client-side.
      if (inline && INLINE_FILES[inline]) {
        var file = INLINE_FILES[inline];
        try {
          var blob = new Blob([file.text], { type: file.type });
          triggerDownload(URL.createObjectURL(blob), filename, true);
        } catch (e) {
          triggerDownload('data:' + file.type + ',' + encodeURIComponent(file.text), filename, false);
        }
        return;
      }

      // Hosted file.
      var url = (this.getAttribute('data-download-url') || '').trim();
      if (url) {
        triggerDownload(url, filename, false);
        return;
      }

      // No URL wired up yet — say so rather than failing silently.
      flash(this, 'Link coming soon', '#64748b');
    });
  });
})();
</script>
