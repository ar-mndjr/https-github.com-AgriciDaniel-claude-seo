# Pages CMS configuration — https://pagescms.org/docs/
# Open https://app.pagescms.org, sign in with GitHub and pick this repository.
media:
  input: site/public/images
  output: /images

content:
  - name: blog
    label: Blog posts
    type: collection
    path: site/src/content/blog
    filename: "{primary}.md"
    view:
      fields: [title, date, category, draft]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: "Summary (shown on cards and in Google)", type: text }
      - { name: date, label: Publish date, type: date, required: true }
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [seo, web, automation]
      - { name: subcategory, label: "Small label above the title (e.g. Technical SEO / Logs)", type: string }
      - { name: read_time, label: Read time (minutes), type: number }
      - name: cover
        label: Cover illustration (used when no cover image is uploaded)
        type: select
        options:
          values: ["agent", "bench", "crawl", "crm", "cwv", "entity", "headless", "migrate", "programmatic", "webhook"]
      - { name: cover_image, label: Cover image (optional), type: image }
      - { name: metric, label: "Headline number (e.g. +185%)", type: string }
      - { name: metric_label, label: "Headline number label (e.g. Organic clicks)", type: string }
      - { name: featured, label: Feature at the top of the blog, type: boolean }
      - { name: popular, label: Show in Most Read, type: boolean }
      - { name: draft, label: "Draft (hidden from the site)", type: boolean }
      - { name: author, label: Author, type: string, default: April }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: tldr, label: TL;DR points (optional), type: text, list: true }
      - name: highlights
        label: TL;DR numbers (optional)
        type: object
        list: true
        fields:
          - { name: value, label: Number, type: string }
          - { name: label, label: Label, type: string }
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown

  - name: settings
    label: Site settings (email, links, footer)
    type: file
    path: site/src/content/settings.json
    format: json
    fields:
      - name: site_name
