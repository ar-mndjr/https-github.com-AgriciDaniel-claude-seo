          "@id": "https://stellaelectricllc.com/aluminum-wiring-inspection/#faq-1",
          "name": "How do I know if my house has aluminum wiring?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Homes built or rewired roughly between 1965 and 1973 are the ones to check. The cable jacket is often printed with ALUMINUM or AL, and the conductors are silver rather than copper-colored. The check has to be done at the panel and at devices, so it is work for an electrician, not a visual guess from the basement."
          }
        },
        {
          "@type": "Question",
          "@id": "https://stellaelectricllc.com/aluminum-wiring-inspection/#faq-2",
          "name": "Is aluminum wiring dangerous?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The wire itself is not the problem - the terminations are. Aluminum expands, contracts and oxidizes differently than copper, so connections at outlets, switches and splices loosen over time and overheat. Homes with aluminum branch circuits have a documented history of connection failures at those points."
          }
        },
        {
          "@type": "Question",
          "@id": "https://stellaelectricllc.com/aluminum-wiring-inspection/#faq-3",
          "name": "Does aluminum wiring have to be replaced?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not necessarily. The recognized remediation is to repair the connections rather than rip out the wiring - most commonly COPALUM crimp connectors or AlumiConn connectors that join the aluminum conductor to a copper pigtail at every device and splice. Full rewiring is the alternative when the wiring is damaged or the home is already being renovated."
          }
        },
        {
          "@type": "Question",
          "@id": "https://stellaelectricllc.com/aluminum-wiring-inspection/#faq-4",
          "name": "Can I just install regular outlets and switches on aluminum wiring?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Devices used with aluminum conductors must be listed for it - marked CO/ALR for receptacles and switches - and standard devices are a common cause of the overheating this wiring is known for. Even with listed devices, the connector-based repairs are the accepted fix."
          }
        },
        {
          "@type": "Question",

          "name": "What does an aluminum wiring inspection involve?",

            "@type": "Answer",
            "text": "An electrician confirms whether the branch circuits are aluminum, opens a representative sample of devices and junction boxes to check the terminations, looks for heat damage, discoloration and loose connections at the panel, and reports on which repair approach fits the home."
          }
        },

          "@type": "Question",
