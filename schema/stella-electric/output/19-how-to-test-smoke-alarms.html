            "@type": "Answer",

            "@type": "Answer",
            "text": "The test button is what the manufacturers specify, and it checks the horn, power and electronics. Canned test aerosols are made for the purpose if you want to verify the sensor itself; open flame and smoke sources are not appropriate for a household test."

          "name": "What does it mean when my smoke alarm chirps?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A single periodic chirp is usually a low backup battery, or an end-of-life signal on a sealed ten-year unit. Chirping can also come from dust in the chamber or from a unit past its replacement date - check the manufacture date before assuming it is the battery."
          }
        },
        {
          "@type": "Question",
          "@id": "https://stellaelectricllc.com/how-to-test-smoke-alarms/#faq-4",
          "name": "When should smoke alarms be replaced?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ten years from the manufacture date printed on the unit, regardless of whether it still passes the test. Maryland also requires battery-only alarms over ten years old to be replaced with sealed ten-year lithium battery units."
          }
        },
        {
          "@type": "Question",

          "name": "Why do all my alarms go off at once?",

            "@type": "Answer",
            "text": "Because they are interconnected, which is how they are supposed to work - one alarm detecting smoke sounds every alarm in the house. If they sound with no cause, the trigger is usually steam, cooking, dust or a failing unit, and finding which alarm initiated is the first step."
          }
        },
        {
          "@type": "Question",
          "@id": "https://stellaelectricllc.com/how-to-test-smoke-alarms/#faq-6",
          "name": "Do hardwired smoke alarms still need batteries?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The battery is the backup that keeps the alarm working during a power outage, which is exactly when candle and generator fires happen."
