            "@type": "Answer",
            "text": "Anything that needs access: replacing original wiring, adding circuits, upgrading the panel, roughing in EV charging, adding surge protection, running new lighting and switching, hardwiring interconnected alarms, and pulling network cable. Access is the expensive part of electrical work, and a renovation gives it to you for free."

            "@type": "Answer",
            "text": "Often, yes. Work that extends or modifies circuits generally has to meet current code for the affected areas, and renovations frequently trigger requirements for AFCI and GFCI protection and for hardwired interconnected smoke alarms. The scope depends on the work and on your jurisdiction's adopted code."
          }

            "@type": "Answer",
            "text": "If the panel is full, undersized for the finished project, or a fuse box or recalled brand, do it as part of the project rather than after. Panel work during the renovation avoids a second round of scheduling, permitting and utility coordination."
          }

            "text": "Twice: at rough-in, after framing and before insulation and drywall, and again at trim-out once the walls and finishes are done. The planning conversation should happen before demolition, while the layout can still change."
          }
