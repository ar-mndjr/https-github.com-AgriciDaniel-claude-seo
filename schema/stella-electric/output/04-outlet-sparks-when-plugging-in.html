          "@id": "https://stellaelectricllc.com/outlet-sparks-when-plugging-in/#faq-1",
          "name": "Is it normal for an outlet to spark when you plug something in?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A single quick blue spark as the plug makes contact can be normal. It is the inrush of current as the device draws power, and it happens most often with appliances that have motors or large power supplies. Anything more than that brief spark is not normal."
          }
        },
        {
          "@type": "Question",
          "@id": "https://stellaelectricllc.com/outlet-sparks-when-plugging-in/#faq-2",
          "name": "When is a sparking outlet dangerous?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Treat it as dangerous when the sparks are yellow or white, when they repeat or continue after the plug is seated, when the outlet sparks with nothing plugged in, or when you notice buzzing, a burning smell, scorch marks, melted plastic or an outlet that is warm to the touch. Shut the circuit off and call an electrician."
          }
        },
        {
          "@type": "Question",
          "@id": "https://stellaelectricllc.com/outlet-sparks-when-plugging-in/#faq-3",
          "name": "What causes an outlet to spark?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Common causes are worn receptacle contacts, loose or back-stabbed wire connections behind the outlet, moisture in the box, an overloaded circuit, short circuits from damaged cable or a device fault, and aging aluminum or deteriorated wiring."
          }
        },
        {
          "@type": "Question",
          "@id": "https://stellaelectricllc.com/outlet-sparks-when-plugging-in/#faq-4",
          "name": "Can I keep using an outlet that sparked?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Arcing generates enough heat to ignite the box, the wiring insulation and surrounding framing. Turn the circuit off at the breaker and leave it off until a licensed electrician has inspected and repaired it."
          }
        },
        {
          "@type": "Question",
          "@id": "https://stellaelectricllc.com/outlet-sparks-when-plugging-in/#faq-5",
          "name": "Should a sparking outlet be treated as an electrical emergency?",

            "@type": "Answer",
            "text": "If there is smoke, flame, a burning smell, a hot outlet or sparking that will not stop with the breaker on, yes - shut off the power and call for emergency electrical service. A single brief spark on plug-in with no other symptoms can wait for a scheduled repair visit."
          }
        }
