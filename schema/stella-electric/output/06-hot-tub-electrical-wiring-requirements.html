            "@type": "Answer",
            "text": "Most 240-volt hot tubs run on a dedicated GFCI-protected circuit, and 50 amps is the most common size. The correct size comes from the equipment nameplate and the manufacturer's installation manual, not from the size of the tub, because heater and pump loads vary by model."
          }

          "@type": "Question",

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The National Electrical Code requires GFCI protection for hot tub and spa circuits, normally provided by a GFCI breaker in the spa disconnect panel next to the tub."
          }

          "@type": "Question",

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The disconnect must be readily accessible, within sight of the tub, at least 5 feet from the inside wall of the tub, and no more than 50 feet away. The distance keeps someone in the water from reaching it while still allowing anyone nearby to cut power fast."
          }
        },
        {
          "@type": "Question",

          "name": "What is bonding and why does a hot tub need it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Bonding ties the metal parts of the installation together with a solid #8 copper conductor so they all sit at the same electrical potential. It is what prevents a dangerous voltage difference between the water, the tub shell and the surrounding surface if a fault occurs."
          }
        },
        {
          "@type": "Question",

          }
